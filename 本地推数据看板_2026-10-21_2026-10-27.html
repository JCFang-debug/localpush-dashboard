<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巨量本地推 · 数据看板</title>
<style>
:root{--bg:#0b1224;--card:#141d35;--card2:#1a2542;--line:#28324e;--txt:#e8eefc;--dim:#8b98b8;
--cyan:#38bdf8;--green:#34d399;--pink:#f472b6;--yellow:#fbbf24;--red:#f87171;--purple:#818cf8;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0b1224,#0a0f1f);color:var(--txt);
font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;padding:0 0 60px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 28px 14px;border-bottom:1px solid var(--line);background:rgba(20,29,53,.6)}
.hd h1{font-size:22px;letter-spacing:1px}
.hd h1 .em{color:var(--cyan)}
#hdmeta{color:var(--dim);font-size:12px;margin-top:4px}
.badge{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:6px 12px;border-radius:20px;background:var(--card)}
.controls{margin:16px 28px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:26px;flex-wrap:wrap}
.ctl{flex:1;min-width:320px}
.ctl-lb{font-size:13px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.lk{color:var(--cyan);cursor:pointer;font-size:12px;user-select:none}
.lk:hover{text-decoration:underline}
.acc-list{display:flex;flex-wrap:wrap;gap:8px}
.acc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s;user-select:none}
.acc:hover{border-color:var(--cyan)}
.acc.on{border-color:var(--cyan);background:rgba(56,189,248,.12);box-shadow:0 0 0 1px var(--cyan) inset}
.acc input{accent-color:var(--cyan);cursor:pointer}
.acc .nm{font-size:13px}
.acc .sp{font-size:11px;color:var(--dim)}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qbtns{display:flex;gap:6px}
.q{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.q:hover{border-color:var(--cyan)}
.q.on{background:rgba(56,189,248,.15);border-color:var(--cyan);color:var(--cyan)}
input[type=date]{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;color-scheme:dark}
.go{background:linear-gradient(135deg,#38bdf8,#6366f1);border:0;color:#fff;font-weight:600;font-size:14px;padding:9px 26px;border-radius:9px;cursor:pointer;box-shadow:0 4px 16px rgba(56,189,248,.3)}
.go:hover{filter:brightness(1.1)}
.go:active{transform:scale(.97)}
.note{color:var(--dim);font-size:12px;margin-top:9px}
.wrap{padding:18px 28px 0;max-width:1280px;margin:0 auto}
.acc-strip{display:flex;gap:10px;flex-wrap:wrap;margin:14px 28px 0;max-width:1280px}
.wrap{padding-left:0;padding-right:0}
body > .wrap,body > .grid2,body > .sec{max-width:1280;margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12px;min-width:180px}
.chip b{font-size:14px;color:var(--cyan)}
.chip .x{color:var(--dim);margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.card .lb{font-size:12px;color:var(--dim)}
.card .v{font-size:25px;font-weight:700;margin-top:5px}
.card .d{font-size:11px;margin-top:5px;color:var(--dim)}
.card .d.up{color:var(--green)}.card .d.down{color:var(--red)}
.card.p .v{color:var(--cyan)}.card.g .v{color:var(--green)}.card.v .v{color:var(--purple)}
.sec{margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h3 .sub{font-size:11px;color:var(--dim);font-weight:400}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{font-size:12px;padding:4px 12px;border-radius:7px;background:var(--card2);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.tab.on{color:var(--cyan);border-color:var(--cyan);background:rgba(56,189,248,.1)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.grid2>*{min-width:0}
svg{display:block;width:100%;height:auto}
#tip{position:fixed;pointer-events:none;background:rgba(10,16,32,.95);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;display:none;z-index:99;max-width:280px;line-height:1.7}
.hour-wrap{display:grid;grid-template-columns:34px 1fr 26px;gap:0 8px;align-items:end}
.hours{display:flex;gap:3px;height:150px;align-items:flex-end}
.hcell{flex:1;background:rgba(56,189,248,.5);border-radius:3px 3px 0 0;min-height:2px;cursor:default;transition:.15s}
.hcell:hover{filter:brightness(1.4)}
.hlab{display:flex;gap:3px;margin-top:6px}
.hlab div{flex:1;text-align:center;font-size:10px;color:var(--dim)}
.hroi{display:flex;flex-direction:column-reverse;gap:3px;height:150px}
.rc{height:100%;border-radius:3px;cursor:default}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fbar{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.fbar .fl{width:64px;color:var(--dim);text-align:right}
.ftrack{flex:1;background:var(--card2);border-radius:7px;height:26px;overflow:hidden}
.ffill{height:100%;background:linear-gradient(90deg,#6366f1,#38bdf8);border-radius:7px;display:flex;align-items:center;padding-left:10px;font-size:12px;white-space:nowrap;min-width:56px}
.ins{display:flex;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.6}
.ins:last-child{border-bottom:0}
.ins .ic{font-weight:700}
.ins.good .ic{color:var(--green)}.ins.ok .ic{color:var(--cyan)}.ins.warn .ic{color:var(--yellow)}.ins.bad .ic{color:var(--red)}
.prow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.prow .nm{width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.prow .tr{flex:1;height:8px;background:var(--card2);border-radius:5px;overflow:hidden;min-width:60px}
.prow .fl{height:100%;background:linear-gradient(90deg,#0ea5e9,#6366f1);border-radius:5px}
.roib{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.roi-g{background:rgba(52,211,153,.15);color:var(--green)}
.roi-y{background:rgba(251,191,36,.15);color:var(--yellow)}
.roi-r{background:rgba(248,113,113,.15);color:var(--red)}
.ttabs{display:flex;gap:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--card2);color:var(--dim);font-weight:500;padding:9px 10px;text-align:right;cursor:pointer;white-space:nowrap;position:sticky;top:0}
th:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid rgba(40,50,78,.5);white-space:nowrap}
td:first-child{text-align:left;max-width:340px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:rgba(56,189,248,.06)}
td.pos{color:var(--green);font-weight:600}
td.neg{color:var(--red)}
.tbl-scroll{max-height:520px;overflow:auto;border-radius:10px}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
.slot-row{display:grid;grid-template-columns:72px 1fr 230px;gap:10px;align-items:center;margin:11px 0;font-size:12.5px}
.slot-row .nm{color:var(--dim)}
.slot-row .nm b{color:var(--txt);font-size:13px;display:block;margin-bottom:2px}
.slot-track{height:30px;background:var(--card2);border-radius:8px;overflow:hidden;position:relative}
.slot-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:#fff;white-space:nowrap;min-width:50px;font-weight:600}
.slot-meta{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.5}
.slot-meta b{color:var(--cyan);font-weight:600}
.peaks{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.peak-card{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.peak-card .lb{font-size:11px;color:var(--dim);margin-bottom:5px}
.peak-card .v{font-size:18px;font-weight:700}
.peak-card .d{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.peak-card.good{border-color:var(--green);background:rgba(52,211,153,.08)}
.peak-card.warn{border-color:var(--yellow);background:rgba(251,191,36,.08)}
.peak-card.bad{border-color:var(--red);background:rgba(248,113,113,.08)}
.peak-card.ok{border-color:var(--cyan);background:rgba(56,189,248,.08)}
.peak-card.good .v{color:var(--green)}.peak-card.warn .v{color:var(--yellow)}
.peak-card.bad .v{color:var(--red)}.peak-card.ok .v{color:var(--cyan)}
/* —— 长期时段规律（归档聚合） —— */
.pat-legend{font-size:11.5px;color:var(--dim);margin:2px 0 10px}
.pat-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 4px;vertical-align:-1px}
.pat-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;height:25px;font-size:12px}
.pat-row .ph{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.pat-row .pbar{height:14px;background:var(--card2);border-radius:3px;overflow:hidden}
.pat-row .pbar i{display:block;height:100%;background:#3b82f6;border-radius:3px;min-width:2px}
.pat-row .pv{color:var(--txt);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pat-row .pv .bad{color:var(--red)}
.pat-heat-scroll{overflow-x:auto;padding-bottom:4px;min-width:0;max-width:100%}
.pat-heat{display:grid;grid-template-columns:46px repeat(24,minmax(26px,1fr));gap:2px;min-width:720px;font-size:10.5px}
.pat-heat .hh{text-align:center;color:var(--dim);padding:2px 0}
.pat-heat .hw{color:var(--dim);display:flex;align-items:center;white-space:nowrap;font-size:11px}
.pat-heat .hc{height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-variant-numeric:tabular-nums}
.pat-best{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pat-best .pb{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pat-best .pb.good{border-color:var(--green);background:rgba(52,211,153,.1)}
.pat-best .pb.bad{border-color:var(--red);background:rgba(248,113,113,.1)}
.pat-best .pb .t{font-weight:700;margin-bottom:6px}
.pat-best .pb.good .t{color:var(--green)}.pat-best .pb.bad .t{color:var(--red)}
.pat-best .pb .d{font-size:12.5px;line-height:1.7;color:var(--txt)}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.prow .nm{width:140px}.slot-row{grid-template-columns:60px 1fr}.slot-meta{display:none}.peaks{grid-template-columns:1fr}.pat-row{grid-template-columns:46px 1fr;height:auto;min-height:25px}.pat-row .pbar{min-width:0}.pat-row .pv{grid-column:2;min-width:0;font-size:11px;white-space:normal;line-height:1.4;padding-bottom:2px}.pat-heat-scroll{max-width:100%}}
</style>
</head>
<body>

<header class="hd">
  <div>
    <h1>巨量<span class="em">本地推</span> · 数据看板</h1>
    <div id="hdmeta"></div>
  </div>
  <div class="badge" id="updated"></div>
</header>

<section class="controls">
  <div class="ctl">
    <div class="ctl-lb">投放账户（可多选） <span class="lk" id="accToggle">全选</span></div>
    <div class="acc-list" id="accList"></div>
  </div>
  <div class="ctl">
    <div class="ctl-lb">日期范围</div>
    <div class="date-row">
      <div class="qbtns" id="qbtns">
        <button class="q" data-days="7">近7天</button>
        <button class="q" data-days="14">近14天</button>
        <button class="q on" data-days="30">近30天</button>
        <button class="q" data-days="90">近90天</button>
      </div>
      <input type="date" id="dStart"><input type="date" id="dEnd">
      <button class="go" id="btnGo">生成看板</button>
    </div>
    <div class="note" id="hourNote"></div>
  </div>
  <div class="ctl" style="flex-direction:row;gap:10px;align-items:center;">
    <button class="go" id="btnExportXlsx" onclick="exportXlsx()" style="background:#16a34a;">导出 Excel 报告</button>
    <button class="go" id="btnExportHtml" onclick="exportHtml()">导出 HTML 看板</button>
    <span id="exportHint" style="font-size:12px;color:#6b7280;"></span>
  </div>
</section>

<div class="wrap">
  <div class="acc-strip" id="accStrip" style="margin:14px 0 0"></div>

  <div class="kpis" id="kpis" style="margin-top:14px"></div>

  <div class="sec">
    <div class="panel">
      <h3>日趋势 <span class="sub">点击图例切换指标</span>
        <div class="tabs" id="trendTabs"></div>
      </h3>
      <div id="trendChart"></div>
    </div>
  </div>

  <!-- 分时分析专题区（按小时维度，可切换 1/2/3/7 天） -->
  <div class="grid2" style="grid-template-columns:1fr">
    <div class="panel">
      <h3>24 小时分时表现 <span class="sub" id="hourSub"></span>
        <div class="tabs" id="hourDayTabs">
          <span class="tab" data-hd="1">1天</span>
          <span class="tab" data-hd="2">2天</span>
          <span class="tab" data-hd="3">3天</span>
          <span class="tab on" data-hd="7">7天</span>
        </div>
      </h3>
      <div class="hour-wrap">
        <div></div>
        <div class="hours" id="hBars"></div>
        <div class="hroi" id="hRoi"></div>
      </div>
      <div class="hlab" style="padding-left:42px;padding-right:34px" id="hLab"></div>
      <div class="legend" id="hLegend"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h3>分时段汇总对比 <span class="sub" id="slotSub">6 大时段 · 日均</span></h3>
      <div id="slotBars"></div>
    </div>
    <div class="panel">
      <h3>分时关键时段识别</h3>
      <div id="hourPeaks"></div>
    </div>
  </div>

  <div class="grid2" style="grid-template-columns:1fr">
    <div class="panel">
      <h3>每小时详细指标 <span class="sub" id="hourTblSub">基于近 7 天分时数据 · 日均</span></h3>
      <div class="tbl-scroll" style="max-height:380px"><table id="hourTable"></table></div>
    </div>
  </div>

  <!-- 长期时段规律（基于分时归档跨全部历史，与近 7 天分时分析独立） -->
  <div class="grid2" id="patWrap" style="display:none">
    <div class="panel">
      <h3>长期时段规律 · 24 小时 <span class="sub" id="patSub"></span></h3>
      <div class="pat-legend"><i style="background:#2563eb"></i>日均消耗条　右侧为线索成本/点击率</div>
      <div id="patHours"></div>
    </div>
    <div class="panel">
      <h3>星期 × 小时 消耗热力图 <span class="sub">日均消耗(元)，鼠标悬停看数值</span></h3>
      <div class="pat-heat-scroll"><div id="patHeat" class="pat-heat"></div></div>
    </div>
  </div>
  <div class="grid2" id="patWrap2" style="display:none;grid-template-columns:1fr">
    <div class="panel">
      <h3>长期黄金时段与风险提示 <span class="sub" id="patBestSub">基于全部归档天数的累计口径</span></h3>
      <div id="patBest" class="pat-best"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h3>转化漏斗</h3>
      <div id="funnel"></div>
    </div>
    <div class="panel"><h3>单元 TOP 12（按消耗）</h3><div id="promoBars"></div></div>
  </div>

  <div class="grid2">
    <div class="panel"><h3>素材 TOP 12（按消耗）</h3><div id="matBars"></div></div>
    <div class="panel"><h3>账户消耗分布</h3><div id="accBars"></div></div>
  </div>

  <div class="grid2" style="grid-template-columns:1fr">
    <div class="panel"><h3>自动洞察与建议</h3><div id="insights"></div></div>
  </div>

  <div class="grid2" style="grid-template-columns:1fr">
    <div class="panel">
      <h3>明细数据（点击表头排序）
        <div class="tabs">
          <div class="tab on" id="tabPromo">单元</div>
          <div class="tab" id="tabMat">素材</div>
        </div>
      </h3>
      <div class="ttabs"></div>
      <div class="tbl-scroll"><table id="dtable"></table></div>
    </div>
  </div>

<script>
'use strict';
/* ================= 数据装载 ================= */
const RAW = JSON.parse(document.getElementById('DATA').textContent);
/* daily:    [date, ai, cost, show, click, ctr, cr, conv, form, msg, phone_c, phone, orders, gmv, like, comment, share, play, visited] */
/* hourly:   [date, hour, ai, cost, show, click, ctr, cr, conv, form, msg] */
/* promos:   [pid, name, project, ai, date, cost, show, click, conv, form, msg, orders, gmv] */
/* materials:[mid, name, type, ai, date, cost, show, click, conv, play, like, comment, orders, gmv] */
const A = RAW.accounts, AI2A = {};
A.forEach(a => AI2A[a.i] = a);

const fmtN = v => { v = Number(v)||0;
  if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(2)+'亿';
  if (Math.abs(v) >= 1e4) return (v/1e4).toFixed(1)+'万';
  return (Math.round(v*100)/100).toLocaleString('zh-CN'); };
const fmtM = v => '¥'+fmtN(v);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortName = n => n.length > 8 ? n.slice(0,8) : n;

/* ================= 控件初始化 ================= */
const $ = id => document.getElementById(id);
const selected = new Set(A.map(a => a.i));
let curMetric = 'cost', tableTab = 'promo', sortKey = 'cost', sortAsc = false, curResult = null;
let hourDays = 7;  /* 分时分析天数：1/2/3/7（平台仅保留近 7 天分时数据） */

A.forEach(a => {
  const el = document.createElement('label');
  el.className = 'acc on';
  el.innerHTML = '<input type="checkbox" checked data-ai="'+a.i+'"><span class="nm">'+esc(a.name)+
    '</span><span class="sp">'+fmtM(a.spend)+'</span>';
  $('accList').appendChild(el);
});
$('accList').addEventListener('change', e => {
  const cb = e.target.closest('input[data-ai]'); if (!cb) return;
  const ai = +cb.dataset.ai;
  cb.checked ? selected.add(ai) : selected.delete(ai);
  cb.closest('.acc').classList.toggle('on', cb.checked);
});
$('accToggle').addEventListener('click', () => {
  const all = selected.size !== A.length;
  selected.clear();
  document.querySelectorAll('#accList input').forEach(cb => {
    cb.checked = all;
    cb.closest('.acc').classList.toggle('on', all);
    if (all) selected.add(+cb.dataset.ai);
  });
  $('accToggle').textContent = all ? '清空' : '全选';
});

$('dStart').min = $('dEnd').min = RAW.start;
$('dStart').max = $('dEnd').max = RAW.end;
function setRange(days){
  const end = RAW.end, d = new Date(end+'T00:00:00');
  d.setDate(d.getDate()-(days-1));
  const s = d.toISOString().slice(0,10);
  $('dStart').value = s; $('dEnd').value = end;
  document.querySelectorAll('.q').forEach(b => b.classList.toggle('on', +b.dataset.days === days));
  render();
}
$('qbtns').addEventListener('click', e => {
  const b = e.target.closest('.q'); if (b) setRange(+b.dataset.days);
});
$('dStart').addEventListener('change', () => document.querySelectorAll('.q').forEach(b => b.classList.remove('on')));
$('dEnd').addEventListener('change', () => document.querySelectorAll('.q').forEach(b => b.classList.remove('on')));
$('btnGo').addEventListener('click', render);

/* 分时天数切换（1/2/3/7 天，仅影响分时模块，不影响主区间） */
$('hourDayTabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  hourDays = +b.dataset.hd;
  $('hourDayTabs').querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.hd === hourDays));
  render();
});

$('updated').textContent = '数据更新于 ' + RAW.generated_at + ' · 区间 ' + RAW.start + ' ~ ' + RAW.end;
$('hourNote').textContent = '分时数据仅覆盖 ' + RAW.hourly_start + ' ~ ' + RAW.end + '（平台仅提供最近 7 天）';
$('dStart').value = (() => { const d = new Date(RAW.end+'T00:00:00'); d.setDate(d.getDate()-29); return d.toISOString().slice(0,10); })();
$('dEnd').value = RAW.end;

/* ================= 聚合引擎 ================= */
function aggregate(){
  const s = $('dStart').value, e = $('dEnd').value;
  if (!s || !e) return null;
  const ids = selected;
  const inR = d => d >= s && d <= e;

  /* KPI + 日趋势 */
  const k = {cost:0, show:0, click:0, conv:0, form:0, msg:0, phone:0, orders:0, gmv:0, like:0, comment:0, play:0};
  const tmap = new Map();
  for (const r of RAW.daily) {
    if (!ids.has(r[1]) || !inR(r[0])) continue;
    k.cost+=r[2]; k.show+=r[3]; k.click+=r[4]; k.conv+=r[7]; k.form+=r[8]; k.msg+=r[9]; k.phone+=r[11];
    k.orders+=r[12]; k.gmv+=r[13]; k.like+=r[14]; k.comment+=r[15]; k.play+=r[17];
    let t = tmap.get(r[0]);
    if (!t){ t = {date:r[0], cost:0, show:0, click:0, conv:0, form:0, msg:0, phone:0, orders:0, gmv:0}; tmap.set(r[0], t); }
    t.cost+=r[2]; t.show+=r[3]; t.click+=r[4]; t.conv+=r[7]; t.form+=r[8]; t.msg+=r[9]; t.phone+=r[11]; t.orders+=r[12]; t.gmv+=r[13];
  }
  const trend = [...tmap.values()].sort((a,b)=>a.date<b.date?-1:1);
  k.leads = k.form + k.msg + k.phone;
  k.ctr = k.show ? k.click/k.show*100 : 0;
  k.cpc = k.click ? k.cost/k.click : 0;
  k.cpm = k.show ? k.cost/k.show*1000 : 0;
  k.roi = k.cost ? k.gmv/k.cost : 0;
  k.leadCost = k.leads ? k.cost/k.leads : 0;
  k.leadRate = k.click ? k.leads/k.click*100 : 0;
  k.mode = (k.gmv <= 0 && k.leads > 0) ? 'lead' : 'purchase';
  trend.forEach(t => {
    t.leads = t.form+t.msg+t.phone;
    t.ctr = t.show ? t.click/t.show*100 : 0;
    t.roi = t.cost ? t.gmv/t.cost : 0;
    t.leadCost = t.leads ? t.cost/t.leads : 0;
  });

  /* 环比 */
  let compare = [];
  if (trend.length >= 8) {
    const last = trend.slice(-7), prev = trend.slice(-14,-7);
    const ag = rs => rs.reduce((o,t)=>{o.cost+=t.cost;o.gmv+=t.gmv;o.click+=t.click;o.show+=t.show;
      o.orders+=t.orders;o.leads+=t.leads;return o;},{cost:0,gmv:0,click:0,show:0,orders:0,leads:0});
    const a = ag(last), b = ag(prev);
    a.ctr = a.show?a.click/a.show*100:0; b.ctr = b.show?b.click/b.show*100:0;
    a.leadCost = a.leads?a.cost/a.leads:0; b.leadCost = b.leads?b.cost/b.leads:0;
    const defs = k.mode==='lead'
      ? [['cost','消耗'],['leads','线索量'],['leadCost','线索成本'],['ctr','点击率'],['click','点击量']]
      : [['cost','消耗'],['gmv','成交金额'],['roi','成交ROI'],['orders','成交订单'],['ctr','点击率']];
    if (k.mode==='purchase'){ a.roi=a.cost?a.gmv/a.cost:0; b.roi=b.cost?b.gmv/b.cost:0; }
    compare = defs.map(([key,label])=>({label, cur:a[key], prev:b[key],
      delta: b[key] ? (a[key]-b[key])/b[key]*100 : 0}));
  }

  /* 分时（按小时聚合，日均；仅取最近 hourDays 天，区别于按天分析的主区间） */
  const hourEnd = new Date(RAW.end+'T00:00:00');
  hourEnd.setDate(hourEnd.getDate()-(hourDays-1));
  const hourStart = hourEnd.toISOString().slice(0,10);
  const hg = new Map();
  for (const r of RAW.hourly){
    if (!ids.has(r[2]) || r[0] < hourStart) continue;
    let h = hg.get(r[1]);
    if (!h){ h={hour:r[1],cost:0,show:0,click:0,leads:0,days:new Set()}; hg.set(r[1],h); }
    h.cost+=r[3]; h.show+=r[4]; h.click+=r[5]; h.leads+=r[9]+r[10]; h.days.add(r[0]);
  }
  const hourly = [];
  let hTotal = 0, hLeadsTotal = 0;
  for (let i=0;i<24;i++){
    const g = hg.get(i), d = g ? Math.max(g.days.size,1) : 1;
    const cost = g ? g.cost/d : 0;
    const show = g ? g.show/d : 0;
    const click = g ? g.click/d : 0;
    const leads = g ? g.leads/d : 0;
    const ctr = g && g.show ? g.click/g.show*100 : 0;
    const cpc = click ? cost/click : 0;
    hourly.push({hour:i, cost, show, click, leads, ctr, cpc, leadCost: leads?cost/leads:0, roi:0, share:0, leadShare:0});
    hTotal += cost;
    hLeadsTotal += leads;
  }
  hourly.forEach(h => {
    h.share = hTotal ? h.cost/hTotal*100 : 0;
    h.leadShare = hLeadsTotal ? h.leads/hLeadsTotal*100 : 0;
  });

  /* 分时段汇总（6 大时段：凌晨/早间/午间/下午/晚间/深夜） */
  const SLOT_DEFS = [
    {name:'凌晨', range:'00-06', s:0, e:6},
    {name:'早间', range:'06-09', s:6, e:9},
    {name:'午间', range:'09-12', s:9, e:12},
    {name:'下午', range:'12-18', s:12, e:18},
    {name:'晚间', range:'18-22', s:18, e:22},
    {name:'深夜', range:'22-24', s:22, e:24}
  ];
  const slots = SLOT_DEFS.map(d=>{
    const items = hourly.filter(h=>h.hour>=d.s && h.hour<d.e);
    const cost = items.reduce((s,h)=>s+h.cost,0);
    const show = items.reduce((s,h)=>s+h.show,0);
    const click = items.reduce((s,h)=>s+h.click,0);
    const leads = items.reduce((s,h)=>s+h.leads,0);
    return {
      name:d.name, range:d.range,
      cost, show, click, leads,
      ctr: show ? click/show*100 : 0,
      leadCost: leads ? cost/leads : 0,
      cpc: click ? cost/click : 0,
      costShare: hTotal ? cost/hTotal*100 : 0,
      leadShare: hLeadsTotal ? leads/hLeadsTotal*100 : 0
    };
  });

  /* 单元聚合 */
  const pmap = new Map();
  for (const r of RAW.promos){
    if (!ids.has(r[3]) || !inR(r[4])) continue;
    let p = pmap.get(r[0]);
    if (!p){ p={id:r[0], name:r[1], project:r[2], ai:r[3], cost:0,show:0,click:0,conv:0,form:0,msg:0,orders:0,gmv:0}; pmap.set(r[0],p); }
    p.cost+=r[5]; p.show+=r[6]; p.click+=r[7]; p.conv+=r[8]; p.form+=r[9]; p.msg+=r[10]; p.orders+=r[11]; p.gmv+=r[12];
  }
  const promotions = [...pmap.values()].map(p=>{
    p.leads=p.form+p.msg;
    p.ctr=p.show?p.click/p.show*100:0;
    p.cpc=p.click?p.cost/p.click:0;
    p.roi=p.cost?p.gmv/p.cost:0;
    p.leadCost=p.leads?p.cost/p.leads:0;
    if (ids.size>1) p.displayName = p.name+'｜'+shortName(AI2A[p.ai].name); else p.displayName = p.name;
    return p;
  }).sort((a,b)=>b.cost-a.cost);

  /* 素材聚合 */
  const mmap = new Map();
  for (const r of RAW.materials){
    if (!ids.has(r[3]) || !inR(r[4])) continue;
    let m = mmap.get(r[0]);
    if (!m){ m={id:r[0], name:r[1], type:r[2], ai:r[3], cost:0,show:0,click:0,conv:0,play:0,like:0,comment:0,orders:0,gmv:0}; mmap.set(r[0],m); }
    m.cost+=r[5]; m.show+=r[6]; m.click+=r[7]; m.conv+=r[8]; m.play+=r[9]; m.like+=r[10]; m.comment+=r[11]; m.orders+=r[12]; m.gmv+=r[13];
  }
  const materials = [...mmap.values()].map(m=>{
    m.ctr=m.show?m.click/m.show*100:0;
    m.playRate=m.show?m.play/m.show*100:0;
    m.roi=m.cost?m.gmv/m.cost:0;
    m.convertCost=m.conv?m.cost/m.conv:0;
    if (ids.size>1) m.displayName = m.name+'｜'+shortName(AI2A[m.ai].name); else m.displayName = m.name;
    return m;
  }).sort((a,b)=>b.cost-a.cost);

  /* 账户分布 */
  const accMap = new Map();
  for (const r of RAW.daily){
    if (!ids.has(r[1]) || !inR(r[0])) continue;
    let x = accMap.get(r[1]) || {ai:r[1], cost:0, leads:0, show:0, click:0, gmv:0, orders:0};
    x.cost+=r[2]; x.leads+=r[8]+r[9]+r[11]; x.show+=r[3]; x.click+=r[4]; x.gmv+=r[13]; x.orders+=r[12];
    accMap.set(r[1], x);
  }
  const accStats = [...accMap.values()].sort((a,b)=>b.cost-a.cost);

  /* 洞察 */
  const insights = buildInsights(k, compare, hourly, slots, promotions, materials);
  return {s, e, k, trend, compare, hourly, slots, promotions, materials, accStats, insights, hourStart, hourDays};
}

/* ================= 洞察 ================= */
function buildInsights(k, compare, hourly, slots, promos, mats){
  const out = [];
  const peak = hourly.reduce((a,b)=>b.cost>a.cost?b:a, hourly[0]);
  const active = hourly.filter(h=>h.cost>0);
  const slotActive = slots.filter(s=>s.cost>0);
  const slotBest = slotActive.length ? slotActive.reduce((a,b)=>b.cost>a.cost?b:a) : null;     // 消耗最高时段
  const slotEff  = slotActive.filter(s=>s.leads>0);
  const slotEffBest = slotEff.length ? slotEff.reduce((a,b)=>b.leadCost<a.leadCost?b:a) : null; // 最高效时段
  const slotEffWorst = slotEff.length ? slotEff.reduce((a,b)=>b.leadCost>a.leadCost?b:a) : null;// 最低效时段
  if (k.mode==='lead'){
    if (k.cost>0){
      const lv = k.leadCost<=100?'good':(k.leadCost<=200?'ok':'bad');
      out.push([lv, '整体线索成本 '+fmtM(k.leadCost)+'，共 '+fmtN(k.leads)+' 条线索（表单 '+fmtN(k.form)+' / 私信 '+fmtN(k.msg)+' / 电话 '+fmtN(k.phone)+'），消耗 '+fmtM(k.cost)]);
    }
    const noLead = promos.filter(p=>p.cost>=300 && p.leads===0);
    if (noLead.length){
      const c = noLead.reduce((s,p)=>s+p.cost,0);
      out.push(['bad', noLead.length+' 个单元消耗≥¥300 却 0 线索，合计 '+fmtM(c)+'（占比 '+(k.cost?(c/k.cost*100).toFixed(0):0)+'%），建议暂停或换素材/定向']);
    }
    const withLead = promos.filter(p=>p.leads>0);
    if (withLead.length){
      const q = withLead.filter(p=>p.leads>=3);
      const pool = q.length ? q : withLead.sort((a,b)=>b.leads-a.leads).slice(0,3);
      const best = pool.reduce((a,b)=>b.leadCost<a.leadCost?b:a);
      out.push(['good', '线索成本最低单元「'+best.displayName+'」：'+fmtM(best.leadCost)+'/条（'+fmtN(best.leads)+' 条），建议加预算并复制其素材定向']);
    }
    /* —— 分时（按小时）洞察：区别于按天分析 —— */
    if (slotBest && slotBest.cost>0)
      out.push(['ok', '分时段消耗集中「'+slotBest.name+'（'+slotBest.range+'）」：日均 '+fmtM(slotBest.cost)+'，占全天 '+slotBest.costShare.toFixed(0)+'%，线索占比 '+slotBest.leadShare.toFixed(0)+'%']);
    if (slotEffBest)
      out.push(['good', '分时段最高效「'+slotEffBest.name+'（'+slotEffBest.range+'）」：线索成本 '+fmtM(slotEffBest.leadCost)+'/条（日均 '+fmtN(Math.round(slotEffBest.leads))+' 条），建议加大该时段预算/出价']);
    if (slotEffWorst && slotEffBest && slotEffWorst.leadCost>0 && slotEffBest.leadCost>0){
      const ratio = slotEffWorst.leadCost / slotEffBest.leadCost;
      if (ratio>=1.8)
        out.push(['warn', '分时段成本差距悬殊：「'+slotEffWorst.name+'」线索成本 '+fmtM(slotEffWorst.leadCost)+' / 「'+slotEffBest.name+'」'+fmtM(slotEffBest.leadCost)+'，相差 '+ratio.toFixed(1)+' 倍，建议把 '+slotEffWorst.name+'预算向 '+slotEffBest.name+' 倾斜']);
    }
    const waste = slotActive.filter(s=>s.leads<=0 && s.cost>0);
    if (waste.length){
      const wc = waste.reduce((s,x)=>s+x.cost,0);
      out.push(['bad', waste.length+' 个分时段日均消耗但 0 线索（'+waste.map(x=>x.name).join('、')+'），合计日均 '+fmtM(wc)+'，建议降低该时段出价或暂停投放']);
    }
    if (peak && peak.cost>0)
      out.push(['ok', '小时级消耗峰值在 '+String(peak.hour).padStart(2,'0')+':00-'+String(peak.hour+1).padStart(2,'0')+'，占全天 '+peak.share.toFixed(0)+'%（按小时粒度）']);
    const gh = active.filter(h=>h.leads>0);
    if (gh.length){
      const bh = gh.reduce((a,b)=>b.leadCost<a.leadCost?b:a);
      out.push(['good', '小时级最高效时段 '+String(bh.hour).padStart(2,'0')+':00：线索成本 '+fmtM(bh.leadCost)+'/条（线索占比 '+bh.leadShare.toFixed(0)+'%），可定向加投']);
    }
    compare.forEach(c=>{
      if (c.label==='线索成本' && Math.abs(c.delta)>=15)
        out.push([c.delta<0?'good':'warn', '近 7 天线索成本环比 '+(c.delta>=0?'+':'')+c.delta.toFixed(0)+'%（'+fmtM(c.prev)+' → '+fmtM(c.cur)+'）']);
      if (c.label==='线索量' && Math.abs(c.delta)>=20)
        out.push([c.delta>0?'good':'warn', '近 7 天线索量环比 '+(c.delta>=0?'+':'')+c.delta.toFixed(0)+'%（'+fmtN(c.prev)+' → '+fmtN(c.cur)+'）']);
    });
    const t = mats[0];
    if (t) out.push(['ok', '消耗最高素材「'+t.displayName+'」'+fmtM(t.cost)+'，点击率 '+t.ctr.toFixed(1)+'%，'+
      (t.conv?('转化 '+fmtN(t.conv)+'、转化成本 '+fmtM(t.convertCost)):'暂无转化')]);
  } else {
    if (k.cost>0){
      const lv = k.roi>=1.5?'good':(k.roi>=1?'ok':'bad');
      out.push([lv, '整体成交ROI '+k.roi.toFixed(2)+'，成交金额 '+fmtM(k.gmv)+' / 消耗 '+fmtM(k.cost)]);
    }
    const bad = promos.filter(p=>p.cost>=500 && p.roi<0.8);
    if (bad.length){
      const c = bad.reduce((s,p)=>s+p.cost,0);
      out.push(['bad', bad.length+' 个单元 成交ROI<0.8，合计消耗 '+fmtM(c)+'（占比 '+(k.cost?(c/k.cost*100).toFixed(0):0)+'%），建议排查素材与定向']);
    }
    const good = promos.filter(p=>p.cost>=500 && p.roi>=2);
    if (good.length) out.push(['good', good.length+' 个单元 成交ROI≥2：首推「'+good[0].displayName+'」（成交ROI '+good[0].roi.toFixed(2)+'），建议加预算放量']);
    /* —— 分时（按小时）洞察：区别于按天分析 —— */
    if (slotBest && slotBest.cost>0)
      out.push(['ok', '分时段消耗集中「'+slotBest.name+'（'+slotBest.range+'）」：日均 '+fmtM(slotBest.cost)+'，占全天 '+slotBest.costShare.toFixed(0)+'%']);
    if (peak && peak.cost>0)
      out.push(['ok', '小时级消耗峰值在 '+String(peak.hour).padStart(2,'0')+':00，占全天 '+peak.share.toFixed(0)+'%']);
    if (active.length){
      const bh = active.reduce((a,b)=>b.roi>a.roi?b:a);
      out.push(['ok', '小时级 成交ROI 最高在 '+String(bh.hour).padStart(2,'0')+':00（'+bh.roi.toFixed(2)+'），可提高该时段出价系数']);
    }
    const t = mats[0];
    if (t) out.push(['ok', '素材「'+t.displayName+'」消耗 '+fmtM(t.cost)+' 居首，点击率 '+t.ctr.toFixed(1)+'%，成交ROI '+t.roi.toFixed(2)]);
  }
  return out;
}

/* ================= 渲染 ================= */
function render(){
  if (selected.size === 0){ alert('请至少选择一个账户'); return; }
  curResult = aggregate();
  if (!curResult) return;
  const {k} = curResult;
  renderKpis(); renderAccStrip(); renderTrendTabs(); drawTrend(curMetric);
  renderHourly(); renderHourlySlots(); renderHourlyPeaks(); renderHourlyTable();
  renderFunnel(); renderBars(); renderAccBars(); renderInsights(); renderTable();
}

function renderKpis(){
  const k = curResult.k, c = curResult.compare;
  const defs = k.mode==='lead' ? [
    ['总消耗',fmtM(k.cost),'p','消耗'],['线索合计',fmtN(k.leads),'g','线索量'],
    ['线索成本',fmtM(k.leadCost),'v','线索成本'],['线索率',k.leadRate.toFixed(2)+'%','',null],
    ['点击率',k.ctr.toFixed(2)+'%','','点击率'],['点击均价',fmtM(k.cpc),'',null],
    ['表单 / 私信',fmtN(k.form)+' / '+fmtN(k.msg),'g',null],['互动(赞/评)',fmtN(k.like)+' / '+fmtN(k.comment),'','',null]
  ] : [
    ['总消耗',fmtM(k.cost),'p','消耗'],['成交金额',fmtM(k.gmv),'g','成交金额'],
    ['成交ROI',k.roi.toFixed(2),'v','成交ROI'],['成交订单',fmtN(k.orders),'g','成交订单'],
    ['点击率',k.ctr.toFixed(2)+'%','','点击率'],['点击均价',fmtM(k.cpc),'',null],
    ['线索合计',fmtN(k.leads),'v',null],['互动(赞/评)',fmtN(k.like)+' / '+fmtN(k.comment),'',null]
  ];
  $('kpis').innerHTML = defs.map(([lb,val,cls,ck])=>{
    let d='';
    if (ck){ const x = c.find(z=>z.label===ck);
      if (x){ const downGood = ck==='消耗'||ck==='线索成本';
        const good = downGood ? x.delta<=0 : x.delta>=0;
        d = '<div class="d '+(good?'up':'down')+'">近7日 '+(x.delta>=0?'+':'')+x.delta.toFixed(1)+'%</div>'; } }
    return '<div class="card '+cls+'"><div class="lb">'+lb+'</div><div class="v">'+val+'</div>'+d+'</div>';
  }).join('');
}

function renderAccStrip(){
  const multi = curResult.accStats.length > 1;
  $('accStrip').innerHTML = curResult.accStats.map(x=>{
    const a = AI2A[x.ai];
    const lc = x.leads ? fmtM(x.cost/x.leads) : '—';
    return '<div class="chip"><b>'+esc(a.name)+'</b><span class="x">消耗 '+fmtM(x.cost)+(curResult.k.mode==='lead'?(' · 线索 '+fmtN(x.leads)+' · 成本 '+lc):(' · 成交ROI '+((x.cost)?(x.gmv/x.cost).toFixed(2):'0')))+'</span></div>';
  }).join('') + (multi?'':'');
}

function renderTrendTabs(){
  const lead = curResult.k.mode==='lead';
  const defs = lead ? [['cost','消耗'],['leads','线索量'],['leadCost','线索成本'],['click','点击次数'],['ctr','点击率']]
                    : [['cost','消耗'],['gmv','成交金额'],['roi','成交ROI'],['orders','成交订单'],['click','点击次数'],['ctr','点击率']];
  if (!defs.some(d=>d[0]===curMetric)) curMetric = 'cost';
  $('trendTabs').innerHTML = defs.map(([k,lb])=>'<div class="tab '+(curMetric===k?'on':'')+'" data-k="'+k+'">'+lb+'</div>').join('');
}
$('trendTabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  curMetric = t.dataset.k; renderTrendTabs(); drawTrend(curMetric);
});

function drawTrend(metric){
  const ts = curResult.trend, n = ts.length, el = $('trendChart'), tip = $('tip');
  if (!n){ el.innerHTML = '<div class="empty">所选区间暂无数据</div>'; return; }
  const W=960,H=300,padL=60,padR=18,padT=18,padB=38;
  const valFn = {cost:t=>t.cost, gmv:t=>t.gmv, roi:t=>t.roi, orders:t=>t.orders,
    leads:t=>t.leads, leadCost:t=>t.leadCost, click:t=>t.click, ctr:t=>t.ctr}[metric];
  const fm = {cost:fmtM, gmv:fmtM, roi:v=>v.toFixed(2), orders:fmtN, leads:v=>fmtN(Math.round(v)),
    leadCost:v=>fmtM(Math.round(v)), click:fmtN, ctr:v=>v.toFixed(2)+'%'}[metric];
  const vals = ts.map(valFn);
  let max = Math.max(...vals, 0.0001);
  if (metric==='roi'||metric==='ctr') max *= 1.15;
  const X = i => padL + (n===1?0:i*(W-padL-padR)/(n-1));
  const Y = v => padT + (H-padT-padB)*(1-v/max);
  const pts = vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const area = 'M'+X(0)+','+(H-padB)+' L'+vals.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' L')+' L'+X(n-1)+','+(H-padB)+' Z';
  const ticks = 4;
  let grid = '';
  for (let i=0;i<=ticks;i++){
    const v = max*i/ticks, y = Y(v);
    grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#28324e" stroke-width="1"/>'+
            '<text x="'+(padL-8)+'" y="'+(y+4)+'" fill="#8b98b8" font-size="11" text-anchor="end">'+fm(v)+'</text>';
  }
  const step = Math.ceil(n/10);
  let xl = '';
  ts.forEach((t,i)=>{ if(i%step===0) xl += '<text x="'+X(i)+'" y="'+(H-padB+20)+'" fill="#8b98b8" font-size="10" text-anchor="middle">'+t.date.slice(5)+'</text>'; });
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:300px">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>'+
    grid + xl +
    '<path d="'+area+'" fill="url(#g1)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#38bdf8" stroke-width="2.2" vector-effect="non-scaling-stroke"/>'+
    vals.map((v,i)=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#38bdf8"/>').join('')+
    '<rect id="hoverZone" x="'+padL+'" y="'+padT+'" width="'+(W-padL-padR)+'" height="'+(H-padT-padB)+'" fill="transparent"/></svg>'+
    '<div id="cross" style="position:relative"></div>';
  const svg = el.querySelector('svg');
  svg.addEventListener('mousemove', e=>{
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX-rect.left)/rect.width*W;
    const i = Math.max(0, Math.min(n-1, Math.round((px-padL)/(W-padL-padR)*(n-1))));
    const t = ts[i];
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML = '<b>'+t.date+'</b><br>消耗 '+fmtM(t.cost)+
      (curResult.k.mode==='lead'
        ? '<br>线索 '+fmtN(t.leads)+' · 成本 '+fmtM(Math.round(t.leadCost))
        : '<br>成交金额 '+fmtM(t.gmv)+' · 成交ROI '+t.roi.toFixed(2))+
      '<br>点击 '+fmtN(t.click)+' · 点击率 '+t.ctr.toFixed(2)+'%';
  });
  svg.addEventListener('mouseleave', ()=>tip.style.display='none');
}

function renderHourlyPeaks(){
  const slots = curResult.slots, lead = curResult.k.mode==='lead';
  const hasData = slots.some(s=>s.cost>0);
  if (!hasData){ $('hourPeaks').innerHTML = '<div class="empty">所选区间无分时数据</div>'; return; }
  const active = slots.filter(s=>s.cost>0);
  const peak = active.reduce((a,b)=>b.cost>a.cost?b:a);
  const eff = active.filter(s=>s.leads>0);
  const effBest = eff.length ? eff.reduce((a,b)=>b.leadCost<a.leadCost?b:a) : null;
  const ctrList = active.filter(s=>s.show>0);
  const ctrBest = ctrList.length ? ctrList.reduce((a,b)=>b.ctr>a.ctr?b:a) : null;
  const waste = active.filter(s=>s.leads<=0);
  const cards = [];
  cards.push('<div class="peak-card ok"><div class="lb">消耗集中时段</div>'+
    '<div class="v">'+peak.name+'（'+peak.range+'）</div>'+
    '<div class="d">日均 '+fmtM(peak.cost)+' · 占全天 '+peak.costShare.toFixed(0)+'%'+(lead?(' · 线索占比 '+peak.leadShare.toFixed(0)+'%'):'')+'</div></div>');
  if (lead){
    if (effBest)
      cards.push('<div class="peak-card good"><div class="lb">最高效时段（线索成本最低）</div>'+
        '<div class="v">'+effBest.name+'（'+effBest.range+'）</div>'+
        '<div class="d">线索成本 '+fmtM(effBest.leadCost)+'/条 · 日均 '+fmtN(Math.round(effBest.leads))+' 条线索</div></div>');
    if (waste.length)
      cards.push('<div class="peak-card bad"><div class="lb">0 线索时段（浪费预算）</div>'+
        '<div class="v">'+waste.map(s=>s.name).join('、')+'</div>'+
        '<div class="d">日均消耗合计 '+fmtM(waste.reduce((s,x)=>s+x.cost,0))+' · 建议降低出价或暂停</div></div>');
    else if (eff.length===active.length && active.length)
      cards.push('<div class="peak-card good"><div class="lb">健康度</div>'+
        '<div class="v">全时段有线索</div>'+
        '<div class="d">'+active.length+' 个时段均有线索产出</div></div>');
  } else {
    if (ctrBest && ctrBest.show>0)
      cards.push('<div class="peak-card warn"><div class="lb">高点击率时段</div>'+
        '<div class="v">'+ctrBest.name+'（'+ctrBest.range+'）</div>'+
        '<div class="d">点击率 '+ctrBest.ctr.toFixed(2)+'% · 点击均价 '+fmtM(ctrBest.cpc)+'</div></div>');
  }
  $('hourPeaks').innerHTML = '<div class="peaks">'+cards.join('')+'</div>';
}

const MONEY = v => fmtM(Math.round(v*100)/100);
function renderTable(){
  const lead = curResult.k.mode==='lead';

  if (tableTab==='promo'){
    cols = lead ? [
      ['单元','displayName','s',null],['消耗','cost','m',null],['线索','leads','n',null],
      ['线索成本','leadCost','lc',null],['表单','form','n',null],['私信','msg','n',null],
      ['点击均价','cpc','m',null],['点击率','ctr','p',null]
    ] : [
      ['单元','displayName','s',null],['消耗','cost','m',null],['成交订单','orders','n',null],
      ['成交金额','gmv','m',null],['成交ROI','roi','r',null],['线索','leads','n',null],
      ['点击均价','cpc','m',null],['点击率','ctr','p',null]
    ];
    rows = curResult.promotions;
  } else {
    cols = lead ? [
      ['素材','displayName','s',null],['消耗','cost','m',null],['点击率','ctr','p',null],
      ['转化','conv','n',null],['转化成本','convertCost','lc',null],['展示次数','show','n',null],
      ['播放','play','n',null],['点赞','like','n',null]
    ] : [
      ['素材','displayName','s',null],['消耗','cost','m',null],['展示次数','show','n',null],
      ['点击次数','click','n',null],['点击率','ctr','p',null],['播放率','playRate','p',null],
      ['成交订单','orders','n',null],['成交ROI','roi','r',null]
    ];
    rows = curResult.materials;
  }
  const fns = {s:esc, m:MONEY, n:fmtN, p:v=>v.toFixed(2)+'%',
    r:v=>v.toFixed(2), lc:v=>v?MONEY(v):'—'};
  const cellCls = (type, v) => {
    if (type==='r') return v>=2?'pos':(v<1?'neg':'');
    if (type==='lc') return !v?'neg':(v<=150?'pos':(v>=300?'neg':''));
    return '';
  };
  rows = [...rows].sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    return (typeof x==='string'?x.localeCompare(y):x-y)*(sortAsc?1:-1);
  }).slice(0,200);
  $('dtable').innerHTML = '<thead><tr>'+cols.map(c=>
    '<th data-k="'+c[1]+'">'+c[0]+(sortKey===c[1]?(sortAsc?' ↑':' ↓'):'')+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+cols.map((c,i)=>{

      return '<td'+(i===0?' title="'+esc(v)+'"':'')+(c[3]||cellCls(c[2],v)?' class="'+cellCls(c[2],v)+'"':'')+'>'+fns[c[2]](v)+'</td>';
    }).join('')+'</tr>').join('')+'</tbody>';
}
$('dtable').addEventListener('click', e=>{
  const th = e.target.closest('th[data-k]'); if(!th) return;
  const k = th.dataset.k;
  if (sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=false; }

});

/* ================= 长期时段规律（来自分时归档，仅渲染一次） ================= */
/* pat.hours 行：[h,日均消耗,累计消耗,日均展示,日均点击,点击率,日均线索,线索成本,日均转化,转化成本,消耗占比] */
function renderPattern(){
  const pat = RAW.hourly_pattern;
  if (!pat || !pat.hours || !pat.hours.length) return;
  $('patWrap').style.display = '';
  $('patWrap2').style.display = '';
  $('patSub').textContent = '· 归档 '+pat.start+' ~ '+pat.end+'（共 '+pat.days+' 天）· 日均';

  /* —— 24 小时条形 + 指标 —— */
  const maxCost = Math.max(...pat.hours.map(r=>r[1]), 0.0001);
  $('patHours').innerHTML = pat.hours.map(r=>{
    const h=r[0], cost=r[1], ctr=r[5], leads=r[6], lc=r[7];
    const w = Math.max(cost>0?2:0, cost/maxCost*100);
    const leadTxt = leads>0
      ? '线索 <b>'+fmtM(lc)+'</b>/条 · 日均 '+fmtN(leads)+' 条'
      : '<span class="bad">0 线索</span>';
    return '<div class="pat-row"><span class="ph">'+String(h).padStart(2,'0')+':00</span>'+
      '<span class="pbar"><i style="width:'+w.toFixed(1)+'%"></i></span>'+
      '<span class="pv">'+fmtM(cost)+'/天 · 点击率 '+(ctr*100).toFixed(1)+'% · '+leadTxt+'</span></div>';
  }).join('');

  /* —— 星期 × 小时 热力图 —— */
  const wkNames = ['周一','周二','周三','周四','周五','周六','周日'];
  let maxV = 0;
  pat.weekday.forEach(row=>row.forEach(v=>{ if(v>maxV) maxV=v; }));
  let html = '<div></div>';
  for(let h=0;h<24;h++) html += '<div class="hh">'+h+'</div>';
  pat.weekday.forEach((row,w)=>{
    html += '<div class="hw">'+wkNames[w]+'<span style="font-weight:400">('+pat.weekday_days[w]+'天)</span></div>';
    row.forEach((v,h)=>{
      const r = v>0 ? v/maxV : 0;
      const bg = v>0 ? 'rgba(56,189,248,'+(0.15+0.75*r).toFixed(2)+')' : 'rgba(148,163,184,.12)';
      const show = v>=maxV*0.45 ? Math.round(v) : '';
      html += '<div class="hc" style="background:'+bg+'" title="'+wkNames[w]+' '+
        String(h).padStart(2,'0')+':00 日均消耗 '+fmtM(v)+'">'+show+'</div>';
    });
  });
  $('patHeat').innerHTML = html;

  /* —— 黄金时段 / 风险 —— */
  let cards = '';
  if (pat.best.length){
    cards += pat.best.map((b,i)=>{
      const h=b[0];
      return '<div class="pb good"><div class="t">黄金时段 TOP'+(i+1)+' · '+
        String(h).padStart(2,'0')+':00-'+String(h+1).padStart(2,'0')+':00</div>'+
        '<div class="d">线索成本 <b>'+fmtM(b[1])+'</b>/条 · 日均 '+fmtN(b[2])+' 条线索 · 日均消耗 '+
        fmtM(b[3])+'<br>长期表现稳定，建议优先保障该时段预算与出价。</div></div>';
    }).join('');
  }
  if (pat.waste.length){
    const list = pat.waste.map(h=>String(h).padStart(2,'0')+':00').join('、');
    const wCost = pat.waste.reduce((s,h)=>s+pat.hours[h][1],0);
    cards += '<div class="pb bad"><div class="t">高消耗 0 线索时段</div>'+
      '<div class="d">'+list+'（合计日均 '+fmtM(wCost)+'，占全天 '+
      pat.waste.reduce((s,h)=>s+pat.hours[h][10],0).toFixed(0)+'%）<br>长期有消耗但无线索，建议降低该时段出价或暂停投放。</div></div>';
  }
  if (!cards) cards = '<div class="pb"><div class="d" style="color:var(--dim)">归档期内各时段线索数据不足，积累更多天数后将给出黄金时段建议。</div></div>';
  $('patBest').innerHTML = cards;
}
renderPattern();

/* ================= 首屏 ================= */
render();

/* ================= 导出功能 ================= */
const TOOL_API = 'http://127.0.0.1:8765';

function setExportHint(msg, color) {
  const el = document.getElementById('exportHint');
  if (el) { el.textContent = msg; el.style.color = color || '#6b7280'; }
}

async function exportXlsx() {
  setExportHint('正在导出 Excel…', '#2563eb');
  try {
    const r = await fetch(TOOL_API + '/api/export', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if (!r.ok) { setExportHint('导出失败：服务不可用', '#dc2626'); return; }
    const d = await r.json();
    if (d.error) { setExportHint('导出失败：' + d.error, '#dc2626'); }
    else { setExportHint('✓ Excel 已生成并打开', '#16a34a'); }
  } catch(e) {
    setExportHint('工具未运行，请先双击启动「巨量本地推数据工具」', '#dc2626');
  }
}

function exportHtml() {
  setExportHint('正在生成 HTML 副本…', '#2563eb');
  try {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '本地推数据看板_导出.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    setExportHint('✓ HTML 看板已下载', '#16a34a');
  } catch(e) {
    setExportHint('导出失败：' + e.message, '#dc2626');
  }
}
